[package]
name = "NoteX"
version = "0.0.10"
description = "纯本地笔记桌面应用"
authors = ["NoteX"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "notex_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
argon2 = "=0.5.3"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-window-state = "2"
thiserror = "2.0.16"
time = { version = "0.3.45", features = ["formatting"] }
uuid = { version = "1.24.0", features = ["v4"] }
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
