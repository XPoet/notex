<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/notex-icon.svg" />
    <title>NoteX</title>
    <style>
      html,
      body,
      #app {
        block-size: 100%;
        margin: 0;
      }

      body {
        min-inline-size: 320px;
        overflow: hidden;
        background: #f7f5ef;
        color: #1f1d18;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      .startup-splash {
        display: grid;
        min-block-size: 100%;
        place-items: center;
        padding: 24px;
        background: #f7f5ef;
      }

      .startup-splash__panel {
        display: grid;
        min-inline-size: min(100%, 376px);
        min-block-size: 132px;
        justify-items: center;
        gap: 12px;
        padding: 32px;
        border: 1px solid #ded8cc;
        border-radius: 10px;
        background: #fbfaf6;
        box-shadow: 0 16px 40px rgb(52 40 30 / 10%);
      }

      .startup-splash__spinner {
        inline-size: 28px;
        block-size: 28px;
        border: 3px solid rgb(217 119 87 / 18%);
        border-block-start-color: #d97757;
        border-radius: 50%;
        animation: startup-spin 0.9s linear infinite;
      }

      .startup-splash__label {
        margin: 0;
        color: #5e5a52;
        font-size: 14px;
        line-height: 1.6;
      }

      @keyframes startup-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="app-startup-splash" class="startup-splash" aria-live="polite">
        <section class="startup-splash__panel">
          <span class="startup-splash__spinner" aria-hidden="true"></span>
          <p class="startup-splash__label">正在准备本地工作区…</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
