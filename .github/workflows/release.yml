name: Release desktop apps

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: notex-release-main
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      should_build: ${{ steps.release.outputs.should_build }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Prepare draft release
        id: release
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          script: |
            const { pathToFileURL } = await import('node:url')
            const { prepareRelease } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github-release.mjs`).href)
            await prepareRelease({ github, context, core })

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy,rustfmt
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release scripts on the native platform
        run: pnpm exec vitest run tests/release-workflow.spec.mjs tests/github-release.spec.mjs
      - name: Check frontend
        if: matrix.target == 'aarch64-apple-darwin'
        run: pnpm check:frontend
      - name: Check Rust on the native platform
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build installers
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: pnpm exec tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify macOS installer and app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          hdiutil verify "${dmg[0]}"
          mountpoint="$RUNNER_TEMP/notex-install"
          mkdir -p "$mountpoint"
          hdiutil attach "${dmg[0]}" -mountpoint "$mountpoint" -nobrowse -readonly
          trap 'hdiutil detach "$mountpoint"' EXIT
          app="$mountpoint/NoteX.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/NoteX" > "$RUNNER_TEMP/notex-startup.log" 2>&1 &
          app_pid=$!
          sleep 8
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/notex-startup.log"
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true
      - name: Verify Windows installation and app startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-Item "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP 'NoteX-installed'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDirectory" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exited with $($setup.ExitCode)" }
          $application = Join-Path $installDirectory 'NoteX.exe'
          if (-not (Test-Path $application)) { throw 'Installed NoteX.exe is missing' }
          $app = Start-Process -FilePath $application -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "NoteX exited during startup with $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Upload missing installers to the draft
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
          RELEASE_TARGET: ${{ matrix.target }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url')
            const { uploadInstallers } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github-release.mjs`).href)
            await uploadInstallers({ github, context, core, releaseId: process.env.RELEASE_ID, commitSha: process.env.RELEASE_COMMIT, target: process.env.RELEASE_TARGET })

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          persist-credentials: false
      - name: Verify all installers and publish
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit_sha }}
        with:
          script: |
            const { pathToFileURL } = await import('node:url')
            const { publishRelease } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/github-release.mjs`).href)
            await publishRelease({ github, context, core, releaseId: process.env.RELEASE_ID, commitSha: process.env.RELEASE_COMMIT })
